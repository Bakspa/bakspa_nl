  nl: SAFe® kent zes flow metrics.
  en: SAFe® has six flow metrics.
- id: b049
  antwoord: waar
  nl: Flow time start pas als het werk in ontwikkeling wordt genomen.
  en: Flow time starts only when work is accepted into development.
- id: b050
  antwoord: onwaar
