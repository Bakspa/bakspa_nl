# Basisvragen: algemene SAFe®-kennis die bij elke rol hoort.
# Elk oefenexamen haalt ongeveer een derde van de stellingen hieruit.
#
# Per stelling:
#   id:        uniek en NOOIT hergebruiken (b = basis). Nodig om bij te houden welke vragen iemand al zag.
#   antwoord:  waar of onwaar
#   nl / en:   de stelling. Kort houden: je hebt maar 7 seconden om te lezen én te antwoorden.
#
# Dit zijn eigen stellingen, afgeleid van de stof. Gebruik nooit officiële examenvragen.

- id: b001
  antwoord: waar
  nl: SAFe® kent vier Core Values.
  en: SAFe® has four Core Values.
- id: b002
  antwoord: waar
