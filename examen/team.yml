# Vragen voor de rol Agile Team.
# Elk oefenexamen voor deze rol haalt ongeveer twee derde van de stellingen hieruit.
# Opbouw per stelling: zie basis.yml. Id's beginnen met "team-" en worden nooit hergebruikt.
#
# Eigen stellingen, afgeleid van de stof van AI-Empowered SAFe® for Teams.
# Geen officiële examenvragen.

- id: team-001
  antwoord: waar
  nl: "Een Agile Team is cross-functioneel."
  en: "An Agile Team is cross-functional."
- id: team-002
  antwoord: waar
  nl: "Een Agile Team heeft een Product Owner en een Scrum Master/Team Coach."
  en: "An Agile Team has a Product Owner and a Scrum Master/Team Coach."
- id: team-003
  antwoord: onwaar
