# Vragen voor de rol Product Manager.
# Elk oefenexamen voor deze rol haalt ongeveer twee derde van de stellingen hieruit.
# Opbouw per stelling: zie basis.yml. Id's beginnen met "pm-" en worden nooit hergebruikt.
#
# Eigen stellingen, afgeleid van de stof van SAFe® Agile Product Management.
# Geen officiële examenvragen.

- id: pm-001
  antwoord: waar
  nl: "Product Management beheert en prioriteert het ART backlog."
  en: "Product Management manages and prioritizes the ART backlog."
- id: pm-002
  antwoord: waar
  nl: "Product Management kan een functie zijn die meerdere mensen vervullen."
  en: "Product Management can be a function filled by several people."
- id: pm-003
  antwoord: onwaar
  nl: "Product Management is altijd één persoon."
  en: "Product Management is always one person."
- id: pm-004
  antwoord: waar
  nl: "Product Management verkent markt en gebruikers continu."
  en: "Product Management continuously explores markets and users."
- id: pm-005
  antwoord: waar
  nl: "Product Management stemt visie en roadmap af op de strategic themes."
  en: "Product Management aligns vision and roadmap with the strategic themes."
- id: pm-006
  antwoord: onwaar
  nl: "Een roadmap is een vaste toezegging die je niet meer aanpast."
  en: "A roadmap is a fixed commitment you never adjust."
- id: pm-007
  antwoord: waar
  nl: "Hoe verder weg op de roadmap, hoe minder vast de toezegging."
  en: "The further out on the roadmap, the less firm the commitment."
- id: pm-008
  antwoord: waar
  nl: "Primair onderzoek verzamel je zelf, secundair onderzoek komt van anderen."
  en: "You gather primary research yourself; secondary research comes from others."
- id: pm-009
  antwoord: onwaar
  nl: "Marktomvang bepaal je het best met een empathie-interview."
  en: "Market size is best determined with an empathy interview."
- id: pm-010
  antwoord: waar
  nl: "Een A/B-test is een kwantitatieve onderzoekstechniek."
  en: "An A/B test is a quantitative research technique."
- id: pm-011
  antwoord: waar
  nl: "Een empathy map maak je vroeg in het onderzoek."
  en: "An empathy map is created early in research."
- id: pm-012
  antwoord: onwaar
  nl: "Persona's maak je voordat je onderzoek hebt gedaan."
  en: "Personas are created before you've done any research."
- id: pm-013
  antwoord: waar
  nl: "Een empathy map leeft korter dan een persona."
  en: "An empathy map is shorter-lived than a persona."
- id: pm-014
  antwoord: waar
  nl: "In B2B zijn koper en gebruiker vaak verschillende persona's."
  en: "In B2B, buyer and user are often different personas."
- id: pm-015
  antwoord: waar
  nl: "Een koperpersona stuurt vooral de productstrategie."
  en: "A buyer persona mainly drives product strategy."
- id: pm-016
  antwoord: onwaar
  nl: "Een empathy map maak je één keer en werk je daarna niet bij."
  en: "You create an empathy map once and never update it."
- id: pm-017
  antwoord: waar
  nl: "Gemba betekent: de plek waar het werk echt gebeurt."
  en: "Gemba means: the place where the work actually happens."
- id: pm-018
  antwoord: waar
  nl: "Design thinking heeft een probleemdiamant en een oplossingsdiamant."
  en: "Design thinking has a problem diamond and a solution diamond."
- id: pm-019
  antwoord: waar
  nl: "Een MVP toetst de benefit hypothesis."
  en: "An MVP tests the benefit hypothesis."
- id: pm-020
  antwoord: onwaar
  nl: "Een MVP is de eerste volledige versie van het product."
  en: "An MVP is the first complete version of the product."
- id: pm-021
  antwoord: waar
  nl: "Het core product vervult de basisbehoefte van de klant."
  en: "The core product meets the customer's basic need."
- id: pm-022
  antwoord: waar
  nl: "Het augmented product onderscheidt je van concurrenten."
  en: "The augmented product differentiates you from competitors."
- id: pm-023
  antwoord: onwaar
  nl: "In het whole product model is het potential product de basisversie."
  en: "In the whole product model, the potential product is the basic version."
- id: pm-024
  antwoord: waar
  nl: "Whole product thinking kijkt naar de hele klantervaring, ook support."
  en: "Whole product thinking covers the entire customer experience, support included."
- id: pm-025
  antwoord: waar
  nl: "WSJF deelt cost of delay door job size."
  en: "WSJF divides cost of delay by job size."
- id: pm-026
  antwoord: waar
  nl: "Bij gelijke duur kies je eerst de hoogste cost of delay."
  en: "With equal duration, pick the highest cost of delay first."
- id: pm-027
  antwoord: onwaar
  nl: "Een impact-effortmatrix vervangt WSJF."
  en: "An impact-effort matrix replaces WSJF."
- id: pm-028
  antwoord: waar
  nl: "Een impact-effortmatrix helpt bij het maken van een roadmap."
  en: "An impact-effort matrix helps with roadmapping."
- id: pm-029
  antwoord: waar
  nl: "Eerdere prijsbeslissingen beïnvloeden latere prijsbeslissingen."
  en: "Earlier pricing decisions influence later ones."
- id: pm-030
  antwoord: onwaar
  nl: "De prijs van een product heeft geen invloed op klantgedrag."
  en: "A product's price has no effect on customer behavior."
- id: pm-031
  antwoord: waar
  nl: "Vroeg in de levenscyclus heb je meer vrijheid in de prijs."
  en: "Early in the life cycle you have more pricing flexibility."
- id: pm-032
  antwoord: waar
  nl: "Acceptatiecriteria van features ontstaan vaak in ART backlog refinement."
  en: "Feature acceptance criteria often emerge in ART backlog refinement."
- id: pm-033
  antwoord: waar
  nl: "Product Management gebruikt de System Demo om feedback te krijgen."
  en: "Product Management uses the System Demo to get feedback."
- id: pm-034
  antwoord: onwaar
  nl: "Product Management laat de prioriteiten van het ART backlog aan de RTE."
  en: "Product Management leaves the ART backlog priorities to the RTE."
- id: pm-035
  antwoord: waar
  nl: "Product Management en System Architect bespreken samen capacity allocation."
  en: "Product Management and System Architect discuss capacity allocation together."
- id: pm-036
  antwoord: onwaar
  nl: "Enablers horen niet in het ART backlog."
  en: "Enablers don't belong in the ART backlog."
- id: pm-037
  antwoord: waar
  nl: "In de ART-kanban begint een feature in de funnel."
  en: "In the ART kanban, a feature starts in the funnel."
- id: pm-038
  antwoord: waar
  nl: "Na release toets je de benefit hypothesis van een feature."
  en: "After release, you evaluate a feature's benefit hypothesis."
- id: pm-039
  antwoord: onwaar
  nl: "Na release hoef je de benefit hypothesis niet meer te toetsen."
  en: "After release, the benefit hypothesis no longer needs evaluating."
- id: pm-040
  antwoord: waar
  nl: "Release on Demand geeft de business controle over het releasemoment."
  en: "Release on Demand gives the business control over release timing."
- id: pm-041
  antwoord: waar
  nl: "Product Management presenteert de visie op dag 1 van PI Planning."
  en: "Product Management presents the vision on Day 1 of PI Planning."
- id: pm-042
  antwoord: onwaar
  nl: "De RTE presenteert de productvisie op dag 1 van PI Planning."
  en: "The RTE presents the product vision on Day 1 of PI Planning."
- id: pm-043
  antwoord: waar
  nl: "Een goed product is desirable, feasible, viable en sustainable."
  en: "A good product is desirable, feasible, viable and sustainable."
- id: pm-044
  antwoord: waar
  nl: "Marktsegmentatie helpt bepalen voor welke klanten je bouwt."
  en: "Market segmentation helps decide which customers you build for."
- id: pm-045
  antwoord: onwaar
  nl: "Marktritmes en events hoef je niet mee te nemen in de roadmap."
  en: "Market rhythms and events needn't be considered in the roadmap."
- id: pm-046
  antwoord: waar
  nl: "Een customer advisory board helpt de roadmap te toetsen."
  en: "A customer advisory board helps validate the roadmap."
- id: pm-047
  antwoord: waar
  nl: "Een epic heeft een lean business case."
  en: "An epic has a lean business case."
- id: pm-048
  antwoord: waar
  nl: "Na een MVP volgt de keuze: pivot of persevere."
  en: "After an MVP comes the choice: pivot or persevere."
- id: pm-049
  antwoord: onwaar
  nl: "Klopt de hypothese van een epic niet, dan bouw je gewoon door."
  en: "If an epic's hypothesis fails, you simply keep building."
- id: pm-050
  antwoord: waar
  nl: "AI versnelt de analyse van klantinput, niet de empathie."
  en: "AI speeds up analysis of customer input, not empathy."
- id: pm-051
  antwoord: onwaar
  nl: "Met AI hoeft Product Management niet meer met klanten te praten."
  en: "With AI, Product Management no longer needs to talk to customers."
- id: pm-052
  antwoord: waar
  nl: "Product Management bepaalt het wat, de teams bepalen het hoe."
  en: "Product Management decides the what; the teams decide the how."
- id: pm-053
  antwoord: waar
  nl: "Een value exchange model beschrijft hoe klant en organisatie waarde uitwisselen."
  en: "A value exchange model describes how customer and enterprise exchange value."
- id: pm-054
  antwoord: onwaar
  nl: "Kwalitatief onderzoek werkt met grote aantallen en statistiek."
  en: "Qualitative research relies on large numbers and statistics."
- id: pm-055
  antwoord: waar
  nl: "Interviews en focusgroepen zijn kwalitatieve technieken."
  en: "Interviews and focus groups are qualitative techniques."
- id: pm-056
  antwoord: onwaar
  nl: "Business Owners beheren het ART backlog."
  en: "Business Owners manage the ART backlog."
- id: pm-057
  antwoord: waar
  nl: "Een te grote feature splits je zodat hij in één PI past."
  en: "You split a feature that's too big so it fits in one PI."
- id: pm-058
  antwoord: waar
  nl: "Product Management doet mee aan Inspect & Adapt."
  en: "Product Management takes part in Inspect & Adapt."
- id: pm-059
  antwoord: waar
  nl: "Job size in WSJF schat je relatief, als benadering van de duur."
  en: "Job size in WSJF is a relative estimate, a proxy for duration."
- id: pm-060
  antwoord: onwaar
  nl: "Job size is een onderdeel van cost of delay."
  en: "Job size is a component of cost of delay."
- id: pm-061
  antwoord: waar
  nl: "Een PI-roadmap bevat zowel features als enablers."
  en: "A PI roadmap contains both features and enablers."
- id: pm-062
  antwoord: onwaar
  nl: "Een persona beschrijft één specifieke, echte klant."
  en: "A persona describes one specific, real customer."
- id: pm-063
  antwoord: onwaar
  nl: "Secundair onderzoek doe je door zelf klanten te interviewen."
  en: "Secondary research means interviewing customers yourself."
- id: pm-064
  antwoord: onwaar
  nl: "Product Management schat de omvang van stories voor de teams."
  en: "Product Management estimates the size of stories for the teams."
- id: pm-065
  antwoord: onwaar
  nl: "Klantbehoeften neem je pas na de eerste release mee in de strategie."
  en: "Customer needs only enter the strategy after the first release."
- id: pm-066
  antwoord: waar
  nl: "Product Management bewaakt dat de oplossing economisch levensvatbaar is."
  en: "Product Management ensures the solution is economically viable."
- id: pm-067
  antwoord: waar
  nl: "Strategic themes verbinden de portfoliostrategie met de ART."
  en: "Strategic themes connect portfolio strategy to the ART."
- id: pm-068
  antwoord: onwaar
  nl: "Strategic themes worden door de teams zelf bepaald."
  en: "Strategic themes are set by the teams themselves."
- id: pm-069
  antwoord: waar
  nl: "Een visie beschrijft de toekomstige staat van de oplossing."
  en: "A vision describes the future state of the solution."
- id: pm-070
  antwoord: onwaar
  nl: "Een visie is een gedetailleerde lijst features met opleverdata."
  en: "A vision is a detailed feature list with delivery dates."
- id: pm-071
  antwoord: waar
  nl: "Product Management stemt prioriteiten af met de Business Owners."
  en: "Product Management aligns priorities with the Business Owners."
- id: pm-072
  antwoord: waar
  nl: "Een roadmap is een prognose, geen belofte."
  en: "A roadmap is a forecast, not a promise."
- id: pm-073
  antwoord: onwaar
  nl: "Verder weg op de roadmap is de planning het zekerst."
  en: "Further out on the roadmap, the plan is most certain."
- id: pm-074
  antwoord: waar
  nl: "De eerstvolgende PI op de roadmap is het meest betrouwbaar."
  en: "The next PI on the roadmap is the most reliable."
- id: pm-075
  antwoord: waar
  nl: "Een marktritme is een terugkerend moment, zoals een seizoen of beurs."
  en: "A market rhythm is a recurring moment, like a season or trade show."
- id: pm-076
  antwoord: waar
  nl: "Een market event is eenmalig, zoals een lancering of wetswijziging."
  en: "A market event is one-off, like a launch or new regulation."
- id: pm-077
  antwoord: onwaar
  nl: "Marktritmes en market events betekenen hetzelfde."
  en: "Market rhythms and market events mean the same thing."
- id: pm-078
  antwoord: waar
  nl: "Technologieadoptie loopt van innovators tot laggards."
  en: "Technology adoption runs from innovators to laggards."
- id: pm-079
  antwoord: onwaar
  nl: "Early adopters zijn de laatste groep die een technologie omarmt."
  en: "Early adopters are the last group to embrace a technology."
- id: pm-080
  antwoord: waar
  nl: "De 'chasm' ligt tussen early adopters en de early majority."
  en: "The 'chasm' lies between early adopters and the early majority."
- id: pm-081
  antwoord: waar
  nl: "Productstrategie houdt rekening met de levensfase van het product."
  en: "Product strategy considers the product's life-cycle stage."
- id: pm-082
  antwoord: onwaar
  nl: "Elk product in het portfolio verdient dezelfde strategie."
  en: "Every product in the portfolio deserves the same strategy."
- id: pm-083
  antwoord: waar
  nl: "Een goede benefit hypothesis is meetbaar."
  en: "A good benefit hypothesis is measurable."
- id: pm-084
  antwoord: onwaar
  nl: "Een benefit hypothesis hoef je niet te meten."
  en: "A benefit hypothesis doesn't need measuring."
- id: pm-085
  antwoord: waar
  nl: "Leading indicators geven vroeg signaal of een hypothese klopt."
  en: "Leading indicators give an early signal on a hypothesis."
- id: pm-086
  antwoord: onwaar
  nl: "Leading indicators meet je pas een jaar na release."
  en: "Leading indicators are measured only a year after release."
- id: pm-087
  antwoord: waar
  nl: "Product Management stuurt de ART-kanban mede met WIP-limieten."
  en: "Product Management helps steer the ART kanban with WIP limits."
- id: pm-088
  antwoord: waar
  nl: "Features met de hoogste WSJF komen het eerst aan bod."
  en: "Features with the highest WSJF go first."
- id: pm-089
  antwoord: onwaar
  nl: "WSJF bereken je één keer per jaar."
  en: "You calculate WSJF once a year."
- id: pm-090
  antwoord: waar
  nl: "WSJF herbereken je als de omstandigheden veranderen."
  en: "You recalculate WSJF when circumstances change."
- id: pm-091
  antwoord: waar
  nl: "Risicoreductie en kansen zijn onderdeel van cost of delay."
  en: "Risk reduction and opportunity enablement are part of cost of delay."
- id: pm-092
  antwoord: onwaar
  nl: "Risicoreductie heeft geen invloed op cost of delay."
  en: "Risk reduction has no effect on cost of delay."
- id: pm-093
  antwoord: waar
  nl: "Bij WSJF schat je features relatief ten opzichte van elkaar."
  en: "In WSJF, you estimate features relative to each other."
- id: pm-094
  antwoord: waar
  nl: "Bij relatief schatten krijgt het kleinste item vaak de waarde 1."
  en: "In relative estimation, the smallest item often gets a 1."
- id: pm-095
  antwoord: waar
  nl: "Product Management volgt markt en concurrentie."
  en: "Product Management follows the market and competitors."
- id: pm-096
  antwoord: onwaar
  nl: "Concurrentieanalyse is geen taak van Product Management."
  en: "Competitive analysis is not Product Management's job."
- id: pm-097
  antwoord: waar
  nl: "Een value proposition beschrijft waarom klanten voor jou kiezen."
  en: "A value proposition describes why customers choose you."
- id: pm-098
  antwoord: onwaar
  nl: "Een value proposition beschrijft vooral de interne organisatie."
  en: "A value proposition mainly describes the internal organization."
- id: pm-099
  antwoord: waar
  nl: "Een business model canvas helpt een verdienmodel te ontwerpen."
  en: "A business model canvas helps design a business model."
- id: pm-100
  antwoord: waar
  nl: "De prijsstrategie moet passen bij de bedrijfsstrategie."
  en: "The pricing strategy must fit the business strategy."
- id: pm-101
  antwoord: onwaar
  nl: "Een zo laag mogelijke prijs is altijd de beste strategie."
  en: "The lowest possible price is always the best strategy."
- id: pm-102
  antwoord: waar
  nl: "Merk en psychologie spelen een rol bij prijsbepaling."
  en: "Brand and psychology play a role in pricing."
- id: pm-103
  antwoord: onwaar
  nl: "Product Management heeft geen rol in releasebeslissingen."
  en: "Product Management has no role in release decisions."
- id: pm-104
  antwoord: waar
  nl: "Product Management betrekt klanten bij demo's waar dat kan."
  en: "Product Management involves customers in demos where possible."
- id: pm-105
  antwoord: waar
  nl: "Product Management licht de belangrijkste features voor de PI toe."
  en: "Product Management explains the top features for the PI."
- id: pm-106
  antwoord: onwaar
  nl: "In PI Planning maakt Product Management de iteratieplanning voor de teams."
  en: "In PI Planning, Product Management makes the teams' iteration plans."
- id: pm-107
  antwoord: waar
  nl: "Tijdens PI Planning beantwoordt Product Management vragen over scope."
  en: "During PI Planning, Product Management answers scope questions."
- id: pm-108
  antwoord: waar
  nl: "Product Management weegt scope af tegen capaciteit."
  en: "Product Management weighs scope against capacity."
- id: pm-109
  antwoord: onwaar
  nl: "Na PI Planning mag Product Management de scope nooit meer wijzigen."
  en: "After PI Planning, Product Management may never change scope."
- id: pm-110
  antwoord: waar
  nl: "Een epic kan door meerdere ART's worden uitgevoerd."
  en: "An epic can be implemented by multiple ARTs."
- id: pm-111
  antwoord: onwaar
  nl: "Een epic past altijd binnen één PI."
  en: "An epic always fits within one PI."
- id: pm-112
  antwoord: waar
  nl: "Epics gaan door de portfolio-kanban."
  en: "Epics move through the portfolio kanban."
- id: pm-113
  antwoord: waar
  nl: "De uitkomst van een MVP kan ook een pivot zijn."
  en: "The outcome of an MVP can also be a pivot."
- id: pm-114
  antwoord: onwaar
  nl: "Een pivot betekent dat er niets geleerd is."
  en: "A pivot means nothing was learned."
- id: pm-115
  antwoord: waar
  nl: "Kwantitatief onderzoek zegt 'hoeveel', kwalitatief vaak 'waarom'."
  en: "Quantitative research says 'how many', qualitative often 'why'."
- id: pm-116
  antwoord: onwaar
  nl: "Een grote enquête met cijfers is kwalitatief onderzoek."
  en: "A large survey with numbers is qualitative research."
- id: pm-117
  antwoord: waar
  nl: "Gebruikersonderzoek stuurt vooral het productontwerp."
  en: "User research mainly drives product design."
- id: pm-118
  antwoord: waar
  nl: "Product Management bewaakt de balans tussen features en enablers."
  en: "Product Management guards the balance between features and enablers."
- id: pm-119
  antwoord: onwaar
  nl: "Enablers mag je altijd uitstellen ten gunste van features."
  en: "Enablers can always be postponed in favor of features."
- id: pm-120
  antwoord: waar
  nl: "Sustainable: de levenscyclus van het product actief beheren."
  en: "Sustainable: actively managing the product's life cycle."
- id: pm-121
  antwoord: onwaar
  nl: "Product Management schrijft alle stories voor de teams."
  en: "Product Management writes all the stories for the teams."
- id: pm-122
  antwoord: onwaar
  nl: "Een persona vervangt echt contact met klanten."
  en: "A persona replaces real contact with customers."
- id: pm-123
  antwoord: onwaar
  nl: "Design thinking is een eenmalige fase aan het begin."
  en: "Design thinking is a one-time phase at the start."
