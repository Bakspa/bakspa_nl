# Vragen voor de rol Business Owner.
# Elk oefenexamen voor deze rol haalt ongeveer twee derde van de stellingen hieruit.
# Opbouw per stelling: zie basis.yml. Id's beginnen met "bo-" en worden nooit hergebruikt.
#
# Eigen stellingen, afgeleid van de stof van SAFe® Business Owner.
# Geen officiële examenvragen.

