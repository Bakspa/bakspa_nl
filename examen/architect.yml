# Vragen voor de rol Architect.
# Elk oefenexamen voor deze rol haalt ongeveer twee derde van de stellingen hieruit.
# Opbouw per stelling: zie basis.yml. Id's beginnen met "architect-" en worden nooit hergebruikt.
#
# Eigen stellingen, afgeleid van de stof van SAFe® for Architects.
# Geen officiële examenvragen.

- id: architect-001
  antwoord: waar
  nl: "De System Architect definieert enablers en de architectural runway."
  en: "The System Architect defines enablers and the architectural runway."
- id: architect-002
  antwoord: waar
  nl: "De System Architect bepaalt de NFR's van het systeem."
  en: "The System Architect defines the system's NFRs."
- id: architect-003
  antwoord: onwaar
  nl: "Architecten werken het best los van de teams."
  en: "Architects work best separately from the teams."
- id: architect-004
  antwoord: waar
  nl: "Architectuur moet aansluiten op de bedrijfsprioriteiten."
  en: "Architecture must align with business priorities."
- id: architect-005
  antwoord: waar
  nl: "De Solution Architect werkt over meerdere ART's en leveranciers heen."
  en: "The Solution Architect works across multiple ARTs and suppliers."
- id: architect-006
  antwoord: onwaar
  nl: "De Solution Architect werkt binnen één team."
  en: "The Solution Architect works within a single team."
- id: architect-007
  antwoord: waar
  nl: "SAFe® kent Enterprise, Solution en System Architects."
  en: "SAFe® has Enterprise, Solution and System Architects."
- id: architect-008
  antwoord: waar
  nl: "Intentional architecture: richtlijnen van architecten voor de lange termijn."
  en: "Intentional architecture: architects' guidelines for the long term."
- id: architect-009
  antwoord: waar
  nl: "Emergent design: teams verbeteren de architectuur tijdens het bouwen."
  en: "Emergent design: teams improve the architecture while building."
- id: architect-010
  antwoord: onwaar
  nl: "SAFe® gaat uit van 'emergent architecture' zonder plan."
  en: "SAFe® relies on 'emergent architecture' without a plan."
- id: architect-011
  antwoord: waar
  nl: "Je hebt een balans nodig tussen intentional architecture en emergent design."
  en: "You need a balance between intentional architecture and emergent design."
- id: architect-012
  antwoord: onwaar
  nl: "Hoe groter het systeem, hoe minder intentionaliteit nodig is."
  en: "The bigger the system, the less intentionality it needs."
- id: architect-013
  antwoord: waar
  nl: "De architectural runway bestaat uit code, componenten en infrastructuur."
  en: "The architectural runway consists of code, components and infrastructure."
- id: architect-014
  antwoord: onwaar
  nl: "De architectural runway is vooral documentatie."
  en: "The architectural runway is mainly documentation."
- id: architect-015
  antwoord: waar
  nl: "Nieuwe features verbruiken de architectural runway."
  en: "New features consume the architectural runway."
- id: architect-016
  antwoord: waar
  nl: "Enablers bestaan op alle niveaus van SAFe®."
  en: "Enablers exist at every level of SAFe®."
- id: architect-017
  antwoord: onwaar
  nl: "Enablers bestaan alleen op portfolioniveau."
  en: "Enablers exist only at portfolio level."
- id: architect-018
  antwoord: waar
  nl: "Enablers worden geschat, gevolgd en vallen onder WIP-limieten."
  en: "Enablers are estimated, tracked and subject to WIP limits."
- id: architect-019
  antwoord: waar
  nl: "Een NFR begint vaak als enabler en beperkt daarna al het werk."
  en: "An NFR often starts as an enabler and then constrains all work."
- id: architect-020
  antwoord: onwaar
  nl: "Een gerealiseerde NFR blijft altijd als item in het backlog staan."
  en: "An implemented NFR always stays as an item in the backlog."
- id: architect-021
  antwoord: waar
  nl: "Een geldende NFR verwerk je in de DoD of in acceptatiecriteria."
  en: "An existing NFR is applied via the DoD or acceptance criteria."
- id: architect-022
  antwoord: waar
  nl: "NFR's beheren gedurende hun hele levenscyclus is een kerntaak van architecten."
  en: "Managing NFRs across their whole life cycle is a core architect task."
- id: architect-023
  antwoord: onwaar
  nl: "NFR's zijn de verantwoordelijkheid van de testers."
  en: "NFRs are the testers' responsibility."
- id: architect-024
  antwoord: waar
  nl: "Solution Intent heeft vaste en variabele delen."
  en: "Solution Intent has fixed and variable parts."
- id: architect-025
  antwoord: waar
  nl: "Waar het kan, houd je Solution Intent zo lang mogelijk variabel."
  en: "Where possible, keep Solution Intent variable as long as possible."
- id: architect-026
  antwoord: onwaar
  nl: "Je legt alle Solution Intent zo vroeg mogelijk vast."
  en: "You fix all Solution Intent as early as possible."
- id: architect-027
  antwoord: waar
  nl: "Onderzoek eerst de gebieden met het hoogste risico."
  en: "Explore the highest-risk areas first."
- id: architect-028
  antwoord: waar
  nl: "Set-based design houdt meerdere ontwerpopties open."
  en: "Set-based design keeps multiple design options open."
- id: architect-029
  antwoord: onwaar
  nl: "Set-based design kiest zo vroeg mogelijk één ontwerp."
  en: "Set-based design picks one design as early as possible."
- id: architect-030
  antwoord: waar
  nl: "Modellen, simulaties en trade studies helpen van variabel naar vast."
  en: "Models, simulations and trade studies help move from variable to fixed."
- id: architect-031
  antwoord: waar
  nl: "Deploy en release loskoppelen vraagt bijna altijd hulp van architecten."
  en: "Decoupling deploy from release almost always needs architects' help."
- id: architect-032
  antwoord: waar
  nl: "Met feature toggles zet je functionaliteit verborgen in productie."
  en: "Feature toggles let you put functionality in production hidden."
- id: architect-033
  antwoord: waar
  nl: "Dark launches en blue/green deployments ondersteunen Release on Demand."
  en: "Dark launches and blue/green deployments support Release on Demand."
- id: architect-034
  antwoord: onwaar
  nl: "Bij blue/green deployment vallen deploy en release altijd samen."
  en: "With blue/green deployment, deploy and release always coincide."
- id: architect-035
  antwoord: waar
  nl: "Architectuur bepaalt hoe makkelijk je nieuwe features met kwaliteit bouwt."
  en: "Architecture determines how easily you build new features with quality."
- id: architect-036
  antwoord: waar
  nl: "De System Architect helpt de Continuous Delivery Pipeline te ontwerpen."
  en: "The System Architect helps design the Continuous Delivery Pipeline."
- id: architect-037
  antwoord: waar
  nl: "Domain-Driven Design helpt een gemeenschappelijke taal vast te houden."
  en: "Domain-Driven Design helps maintain a common language."
- id: architect-038
  antwoord: onwaar
  nl: "Domain-Driven Design gaat vooral over databaseontwerp."
  en: "Domain-Driven Design is mainly about database design."
- id: architect-039
  antwoord: waar
  nl: "Team Topologies helpt het systeem langs natuurlijke naden op te delen."
  en: "Team Topologies helps split the system along natural seams."
- id: architect-040
  antwoord: waar
  nl: "Epics splits je in capabilities, capabilities in features."
  en: "Epics split into capabilities; capabilities split into features."
- id: architect-041
  antwoord: onwaar
  nl: "Een story splits je in features."
  en: "You split a story into features."
- id: architect-042
  antwoord: waar
  nl: "Een capability kan meerdere ART's raken."
  en: "A capability can span multiple ARTs."
- id: architect-043
  antwoord: waar
  nl: "Architecten nemen deel aan de voorbereiding van PI Planning."
  en: "Architects take part in preparing PI Planning."
- id: architect-044
  antwoord: onwaar
  nl: "Tijdens PI Planning hebben architecten geen rol."
  en: "Architects have no role during PI Planning."
- id: architect-045
  antwoord: waar
  nl: "Op dag 1 van PI Planning wordt de architectuurvisie gepresenteerd."
  en: "On Day 1 of PI Planning, the architecture vision is presented."
- id: architect-046
  antwoord: waar
  nl: "Architecten zorgen voor voldoende capacity allocation voor enablers."
  en: "Architects ensure enough capacity allocation for enablers."
- id: architect-047
  antwoord: onwaar
  nl: "Enablerwerk plan je pas als er geen features meer zijn."
  en: "You only plan enabler work when there are no features left."
- id: architect-048
  antwoord: waar
  nl: "Persona's helpen ook architecten de Solution Context te begrijpen."
  en: "Personas also help architects understand the Solution Context."
- id: architect-049
  antwoord: waar
  nl: "Solution Context beschrijft de omgeving waarin de oplossing werkt."
  en: "Solution Context describes the environment the solution operates in."
- id: architect-050
  antwoord: onwaar
  nl: "Solution Context en Solution Intent betekenen hetzelfde."
  en: "Solution Context and Solution Intent mean the same thing."
- id: architect-051
  antwoord: waar
  nl: "Architectuurpatronen versnellen werk door bewezen oplossingen te hergebruiken."
  en: "Architectural patterns speed up work by reusing proven solutions."
- id: architect-052
  antwoord: waar
  nl: "De System Architect neemt deel aan release governance."
  en: "The System Architect takes part in release governance."
- id: architect-053
  antwoord: waar
  nl: "Architecten zorgen voor instrumentatie om metrics te meten."
  en: "Architects enable instrumentation to measure metrics."
- id: architect-054
  antwoord: onwaar
  nl: "Architecten hoeven niet aan operations te denken."
  en: "Architects don't need to think about operations."
- id: architect-055
  antwoord: waar
  nl: "Een architect is in SAFe® ook een servant leader."
  en: "In SAFe®, an architect is also a servant leader."
- id: architect-056
  antwoord: onwaar
  nl: "Architectuurbesluiten neem je het best ver vooraf, zonder feedback."
  en: "Architecture decisions are best made far upfront, without feedback."
- id: architect-057
  antwoord: waar
  nl: "Een keuze voor een cloudprovider is een centrale, intentionele beslissing."
  en: "Choosing a cloud provider is a central, intentional decision."
- id: architect-058
  antwoord: waar
  nl: "Architectuurbesluiten leg je vast in de Solution Intent."
  en: "Architecture decisions are recorded in the Solution Intent."
- id: architect-059
  antwoord: onwaar
  nl: "Een enabler-epic heeft geen lean business case nodig."
  en: "An enabler epic doesn't need a lean business case."
- id: architect-060
  antwoord: waar
  nl: "MBSE staat voor model-based systems engineering."
  en: "MBSE stands for model-based systems engineering."
- id: architect-061
  antwoord: onwaar
  nl: "Compliance-eisen pak je pas vlak voor de release op."
  en: "Compliance requirements are only addressed just before release."
- id: architect-062
  antwoord: waar
  nl: "Hoe sneller features komen, hoe meer runway je nodig hebt."
  en: "The faster features come, the more runway you need."
- id: architect-063
  antwoord: onwaar
  nl: "De System Architect bepaalt de prioriteit van het ART backlog."
  en: "The System Architect sets the priority of the ART backlog."
- id: architect-064
  antwoord: onwaar
  nl: "Architectuur heeft weinig invloed op de doorstroming van waarde."
  en: "Architecture has little effect on the flow of value."
- id: architect-065
  antwoord: onwaar
  nl: "Een NFR raakt meestal maar één feature."
  en: "An NFR usually affects only one feature."
- id: architect-066
  antwoord: waar
  nl: "Een Enterprise Architect werkt op portfolioniveau."
  en: "An Enterprise Architect works at portfolio level."
- id: architect-067
  antwoord: onwaar
  nl: "De System Architect werkt over meerdere portfolio's heen."
  en: "The System Architect works across multiple portfolios."
- id: architect-068
  antwoord: waar
  nl: "Architecten helpen waardestromen en ART's te identificeren."
  en: "Architects help identify value streams and ARTs."
- id: architect-069
  antwoord: waar
  nl: "Architecten zijn betrokken bij enabler-epics in de portfolio-kanban."
  en: "Architects are involved in enabler epics in the portfolio kanban."
- id: architect-070
  antwoord: onwaar
  nl: "Architecten hebben geen rol in Lean Portfolio Management."
  en: "Architects have no role in Lean Portfolio Management."
- id: architect-071
  antwoord: waar
  nl: "Een architectuurvisie beschrijft de gewenste richting van het systeem."
  en: "An architecture vision describes the system's desired direction."
- id: architect-072
  antwoord: waar
  nl: "Een architectuurroadmap laat zien welke enablers wanneer nodig zijn."
  en: "An architecture roadmap shows which enablers are needed when."
- id: architect-073
  antwoord: onwaar
  nl: "De architectuurroadmap staat los van de productroadmap."
  en: "The architecture roadmap is separate from the product roadmap."
- id: architect-074
  antwoord: waar
  nl: "Een enabler plan je vóór de feature die hem nodig heeft."
  en: "You plan an enabler before the feature that needs it."
- id: architect-075
  antwoord: onwaar
  nl: "Een enabler plan je het best in dezelfde iteratie als de feature."
  en: "An enabler is best planned in the same iteration as the feature."
- id: architect-076
  antwoord: waar
  nl: "Architecten werken mee aan ART backlog refinement."
  en: "Architects take part in ART backlog refinement."
- id: architect-077
  antwoord: waar
  nl: "Architecten helpen features en enablers te schatten."
  en: "Architects help estimate features and enablers."
- id: architect-078
  antwoord: onwaar
  nl: "Architecten schatten stories namens de teams."
  en: "Architects estimate stories on behalf of the teams."
- id: architect-079
  antwoord: waar
  nl: "Tijdens de team breakouts lopen architecten rond om te helpen."
  en: "During team breakouts, architects circulate to help."
- id: architect-080
  antwoord: waar
  nl: "Architecten helpen technische risico's te ROAMen."
  en: "Architects help ROAM technical risks."
- id: architect-081
  antwoord: onwaar
  nl: "Architecten nemen geen deel aan de management review."
  en: "Architects don't take part in the management review."
- id: architect-082
  antwoord: waar
  nl: "Architecten nemen deel aan de System Demo."
  en: "Architects take part in the System Demo."
- id: architect-083
  antwoord: waar
  nl: "In een Solution Train stemmen architecten af in de Architect Sync."
  en: "In a Solution Train, architects align in the Architect Sync."
- id: architect-084
  antwoord: onwaar
  nl: "Architectuur bespreek je alleen tijdens Inspect & Adapt."
  en: "Architecture is only discussed during Inspect & Adapt."
- id: architect-085
  antwoord: waar
  nl: "Architecten nemen deel aan Inspect & Adapt."
  en: "Architects take part in Inspect & Adapt."
- id: architect-086
  antwoord: waar
  nl: "Spikes helpen technische onzekerheid te verkleinen."
  en: "Spikes help reduce technical uncertainty."
- id: architect-087
  antwoord: waar
  nl: "Een architect houdt technische schuld in de gaten."
  en: "An architect keeps an eye on technical debt."
- id: architect-088
  antwoord: onwaar
  nl: "Technische schuld is alleen een probleem voor developers."
  en: "Technical debt is only a problem for developers."
- id: architect-089
  antwoord: waar
  nl: "Een monoliet maakt onafhankelijk releasen moeilijker."
  en: "A monolith makes independent releases harder."
- id: architect-090
  antwoord: waar
  nl: "Ontkoppelde componenten maken kleinere releases mogelijk."
  en: "Decoupled components enable smaller releases."
- id: architect-091
  antwoord: onwaar
  nl: "Microservices zijn in SAFe® verplicht."
  en: "Microservices are mandatory in SAFe®."
- id: architect-092
  antwoord: waar
  nl: "Een testbare architectuur versnelt Continuous Integration."
  en: "A testable architecture speeds up Continuous Integration."
- id: architect-093
  antwoord: onwaar
  nl: "Een architect hoeft geen rekening te houden met testomgevingen."
  en: "An architect needn't consider test environments."
- id: architect-094
  antwoord: waar
  nl: "Architectuur voor Continuous Exploration ondersteunt snelle experimenten."
  en: "Architecture for Continuous Exploration supports fast experiments."
- id: architect-095
  antwoord: waar
  nl: "Telemetrie helpt bedrijfswaarde na release te meten."
  en: "Telemetry helps measure business value after release."
- id: architect-096
  antwoord: onwaar
  nl: "Monitoring in productie is alleen een taak van operations."
  en: "Monitoring in production is only an operations task."
- id: architect-097
  antwoord: waar
  nl: "Architecting for operations maakt monitoren en herstellen makkelijker."
  en: "Architecting for operations makes monitoring and recovery easier."
- id: architect-098
  antwoord: waar
  nl: "Automatisch herstel verkort de mean time to recovery."
  en: "Automated recovery shortens mean time to recovery."
- id: architect-099
  antwoord: onwaar
  nl: "Recovery uit CALMR is geen zorg van architecten."
  en: "Recovery from CALMR is not architects' concern."
- id: architect-100
  antwoord: waar
  nl: "Een architect helpt kiezen tussen bouwen, kopen of samenwerken."
  en: "An architect helps choose between build, buy or partner."
- id: architect-101
  antwoord: onwaar
  nl: "Zelf bouwen is altijd beter dan kopen."
  en: "Building yourself is always better than buying."
- id: architect-102
  antwoord: waar
  nl: "Leveranciers zijn vaak onderdeel van een grote oplossing."
  en: "Suppliers are often part of a large solution."
- id: architect-103
  antwoord: waar
  nl: "Architecten stemmen interfaces af met leveranciers."
  en: "Architects align interfaces with suppliers."
- id: architect-104
  antwoord: onwaar
  nl: "Leveranciers hoeven de Solution Intent niet te kennen."
  en: "Suppliers needn't know the Solution Intent."
- id: architect-105
  antwoord: waar
  nl: "Compliance kun je deels automatisch in de pipeline toetsen."
  en: "Compliance can partly be checked automatically in the pipeline."
- id: architect-106
  antwoord: waar
  nl: "Traceerbaarheid helpt bij compliance in gereguleerde omgevingen."
  en: "Traceability helps compliance in regulated environments."
- id: architect-107
  antwoord: onwaar
  nl: "Agile werken is onmogelijk in gereguleerde omgevingen."
  en: "Agile working is impossible in regulated environments."
- id: architect-108
  antwoord: waar
  nl: "Een architect coacht teams in architectuurpraktijken."
  en: "An architect coaches teams in architecture practices."
- id: architect-109
  antwoord: waar
  nl: "Een architect deelt kennis, zodat teams zelf goede keuzes maken."
  en: "An architect shares knowledge so teams make good choices themselves."
- id: architect-110
  antwoord: onwaar
  nl: "Een architect neemt alle ontwerpbesluiten zelf."
  en: "An architect makes every design decision personally."
- id: architect-111
  antwoord: waar
  nl: "Besluiten die vaak voorkomen en lokale kennis vragen, decentraliseer je."
  en: "Frequent decisions needing local knowledge are decentralized."
- id: architect-112
  antwoord: waar
  nl: "Besluiten met grote schaal- of langetermijneffecten centraliseer je."
  en: "Decisions with big scale or long-term effects are centralized."
- id: architect-113
  antwoord: onwaar
  nl: "Onomkeerbare, strategische besluiten decentraliseer je altijd."
  en: "Irreversible strategic decisions are always decentralized."
- id: architect-114
  antwoord: waar
  nl: "Een architect is een change agent in een Lean-Agile transformatie."
  en: "An architect is a change agent in a Lean-Agile transformation."
- id: architect-115
  antwoord: waar
  nl: "Architecten werken samen met het LACE."
  en: "Architects work with the LACE."
- id: architect-116
  antwoord: onwaar
  nl: "Architecten blijven buiten de transformatie."
  en: "Architects stay out of the transformation."
- id: architect-117
  antwoord: waar
  nl: "Nieuwe strategic themes kunnen om architectuurwijzigingen vragen."
  en: "New strategic themes can require architecture changes."
- id: architect-118
  antwoord: onwaar
  nl: "Een nieuwe waardestroom vraagt nooit om architectuurwijzigingen."
  en: "A new value stream never requires architecture changes."
- id: architect-119
  antwoord: waar
  nl: "Architecten wegen enablers en features samen met Product Management af."
  en: "Architects weigh enablers and features with Product Management."
- id: architect-120
  antwoord: onwaar
  nl: "Een architect hoeft de business case van een epic niet te kennen."
  en: "An architect needn't know an epic's business case."
- id: architect-121
  antwoord: onwaar
  nl: "Feature toggles maken testen overbodig."
  en: "Feature toggles make testing unnecessary."
- id: architect-122
  antwoord: onwaar
  nl: "NFR's kun je achteraf zonder extra kosten toevoegen."
  en: "NFRs can be added afterwards at no extra cost."
- id: architect-123
  antwoord: onwaar
  nl: "Een Solution Architect werkt nooit met hardware."
  en: "A Solution Architect never works with hardware."
