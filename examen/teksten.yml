    kop: Ken jij je SAFe®-rol?
    intro: "30 stellingen over jouw rol. Waar of niet waar? Je hebt **7 seconden** per stelling, dus geen tijd om het op te zoeken of aan een AI te vragen. Je slaagt bij **85%** goed."
    regels:
      - 30 stellingen, willekeurig gekozen
      - 7 seconden per stelling; te laat telt als fout
      - Sneltoetsen ← waar · → niet waar (of J / N)
      - Elke keer andere stellingen, tot je ze allemaal gezien hebt
    privacy: "Anoniem: ik sla geen naam, e-mailadres of IP-adres op. Je browser onthoudt alleen welke stellingen je al zag."
    disclaimer: "Dit is een oefentoets van Bakspa met eigen stellingen. Het is geen officieel examen en geen examenvraag van Scaled Agile, Inc."
