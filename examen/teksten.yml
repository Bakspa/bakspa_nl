# Instellingen en teksten van het oefenexamen (bakspa.nl/oefenexamen/)
# en de pagina "Opfrissen of certificeren" (bakspa.nl/opfrissen-of-certificeren/).
# De vragen zelf staan in basis.yml en per rol in <code>.yml (bijv. rte.yml).

instellingen:
  aantal_vragen: 30         # stellingen per examen
  seconden_per_vraag: 7     # daarna telt de stelling als fout
  slaaggrens: 85            # percentage goed om te slagen
  aandeel_rol: 0.67         # deel van de stellingen uit de rol; de rest komt uit basis.yml
  minimum_vragen_rol: 40    # een rol is pas te kiezen als <code>.yml minstens zoveel stellingen heeft
  toon_fouten_na_afloop: ja # na afloop de fout beantwoorde stellingen met het goede antwoord tonen

# code = bestandsnaam van de vragen (rte -> rte.yml). training = exacte titel uit inhoud/trainingen.yml.
rollen:
  - code: sm
    nl: Scrum Master
    en: Scrum Master
    training: "AI-Empowered SAFe® Scrum Master"
  - code: pm
    nl: Product Manager
    en: Product Manager
    training: "SAFe® Agile Product Management"
  - code: po
    nl: Product Owner
    en: Product Owner
    training: "AI-Empowered SAFe® Product Owner / Product Manager"
  - code: rte
    nl: Release Train Engineer
    en: Release Train Engineer
    training: "AI-Empowered SAFe® Release Train Engineer"
  - code: bo
    nl: Business Owner
    en: Business Owner
    training: "SAFe® Business Owner"
  - code: team
    nl: Agile Team
    en: Agile Team
    training: "AI-Empowered SAFe® for Teams"
  - code: architect
    nl: Architect
    en: Architect
    training: "SAFe® for Architects"

examen:
  nl:
    titel: SAFe® oefenexamen
    beschrijving: "Hoe goed ken jij je SAFe®-rol? 30 stellingen, 7 seconden per stelling. Geen tijd om het aan een AI te vragen."
