# Pagina "Opfrissen of certificeren". Concepttekst: pas aan naar je eigen aanbod.
opfrissen:
  nl:
    titel: Opfrissen of certificeren
    beschrijving: Je SAFe®-kennis opfrissen of snel gecertificeerd worden, met een training van Willem-Peter Perquin (ASPC).
    eyebrow: Na je oefenexamen
    kop: Opfrissen of certificeren?
    score: "Je haalde {score} op het oefenexamen {rol}."
    intro: Of je nu net niet slaagde of juist klaar bent voor de volgende stap, ik help je verder. In-house met je team of privé.
    blokken:
      - titel: Opfrissen
        tekst: Je hebt de training al eens gevolgd, maar de kennis is weggezakt of je certificering moet verlengd worden.
        punten:
          - Een compacte sessie op de onderdelen waar je score achterbleef
          - Gericht op jouw rol en jouw praktijk
          - Ook geschikt als voorbereiding op je verlenging
      - titel: Certificeren
        tekst: Je wilt het officiële SAFe®-certificaat voor je rol. Dan volg je de officiële training en doe je daarna het examen.
        punten:
          - Officiële SAFe®-training, gegeven door een ASPC
          - In-house voor je team of privé
          - Na de training krijg je toegang tot het officiële examen
    training: "Bij jouw rol past de training **{training}**."
    knop: Stuur me een voorstel
    knop_tweede: Bekijk alle trainingen
    terug: Terug naar het oefenexamen
    mail_onderwerp: "Opfrissen of certificeren: {rol}"
    mail_tekst: "Hallo Willem-Peter,\n\nIk deed het oefenexamen {rol} en haalde {score}. Ik wil graag opfrissen / certificeren.\n\nGroet,\n"
  en:
    titel: Refresh or get certified
    beschrijving: Refresh your SAFe® knowledge or get certified quickly, with a course by Willem-Peter Perquin (ASPC).
    eyebrow: After your practice exam
    kop: Refresh or get certified?
    score: "You scored {score} on the {rol} practice exam."
    intro: Whether you just missed the pass mark or you're ready for the next step, I'll help you get there. In-house with your team or as a private course.
    blokken:
      - titel: Refresh
        tekst: You've taken the course before, but the knowledge has faded or your certification needs renewing.
        punten:
          - A compact session on the topics where your score fell short
          - Focused on your role and your day-to-day work
          - Also useful as preparation for your renewal
      - titel: Get certified
        tekst: You want the official SAFe® certification for your role. You take the official course and then the exam.
        punten:
          - Official SAFe® course, taught by an ASPC
          - In-house for your team or as a private course
          - After the course you get access to the official exam
    training: "The course that fits your role is **{training}**."
    knop: Send me a proposal
    knop_tweede: See all courses
    terug: Back to the practice exam
    mail_onderwerp: "Refresh or get certified: {rol}"
    mail_tekst: "Hi Willem-Peter,\n\nI took the {rol} practice exam and scored {score}. I'd like to refresh / get certified.\n\nBest regards,\n"
