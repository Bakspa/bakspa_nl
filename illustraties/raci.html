<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 627px; background: #18191b; font-family: Inter, sans-serif; color: #c9c9c9; overflow: hidden; position: relative; }
  .glow { position: absolute; right: -160px; top: -200px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(242,140,40,.13), transparent 65%); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #f28c28; }
  .left { position: absolute; left: 64px; top: 56px; width: 400px; }
  .logo { height: 52px; }
  .eyebrow { margin-top: 64px; color: #f28c28; font-weight: 600; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin-top: 14px; color: #fff; font-size: 64px; line-height: 1.02; letter-spacing: -.03em; font-weight: 700; }
  .sub { margin-top: 18px; font-size: 24px; line-height: 1.35; color: #e2e2e2; }
  .tag { margin-top: 34px; display: inline-flex; align-items: center; gap: 12px; font-size: 20px; color: #c9c9c9; }
  .tag b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: #f28c28; color: #18191b; font-size: 18px; }

  .card { position: absolute; left: 500px; top: 52px; width: 640px; height: 520px; background: #202124; border: 1px solid #303236; border-radius: 18px; padding: 22px 24px; }
  table { border-collapse: collapse; width: 100%; position: relative; z-index: 2; }
  th.role { width: 64px; padding-bottom: 12px; }
  .badge { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #e2e2e2; background: #26272a; border: 2px solid #3a3c40; }
  td.label { font-size: 16px; color: #e2e2e2; font-weight: 500; padding-right: 8px; height: 56px; border-top: 1px solid #303236; white-space: nowrap; }
  td.c { text-align: center; border-top: 1px solid #303236; }
  .r { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; font-weight: 700; font-size: 16px; }
  .A { background: #f28c28; color: #18191b; box-shadow: 0 0 0 6px rgba(242,140,40,.16), 0 0 26px rgba(242,140,40,.45); }
  .R { background: rgba(242,140,40,.12); color: #f28c28; border: 1px solid rgba(242,140,40,.35); }
  .C { background: #26272a; color: #c9c9c9; border: 1px solid #3a3c40; }
  .I { color: #7d7d7d; border: 1px dashed #3a3c40; }
  .n { color: #4a4c50; }
  svg.path { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="left">
    <img class="logo" src="bakspa-logo-light.png">
    <div class="eyebrow">SAFe-rollen</div>
    <h1>Wie doet wat?</h1>
    <div class="sub">PM, PO, RTE, SM/TC, team en Business Owners naast elkaar.</div>
    <div class="tag"><b>A</b> Eén eindverantwoordelijke per regel</div>
  </div>
  <div class="card" id="card">
    <svg class="path" id="svg" width="640" height="520"></svg>
    <table id="t">
      <tr><th></th>
        <th class="role"><div class="badge">PM</div></th><th class="role"><div class="badge">PO</div></th>
        <th class="role"><div class="badge">RTE</div></th><th class="role"><div class="badge">SM</div></th>
        <th class="role"><div class="badge">Team</div></th><th class="role"><div class="badge">BO</div></th></tr>
    </table>
  </div>
  <div class="bar"></div>
<script>
  const rows = [
    ["Visie & roadmap",   "ACIIIC"],
    ["ART-backlog",       "ACCIIC"],
    ["Teambacklog",       "CAIC R-".replace(" ","")],
    ["PI-doelen plannen", "CRCRAC"],
    ["Business value",    "CCIICA"],
    ["Risico's ROAM'en",  "CCARRC"],
    ["Flow van de trein", "CIARCI"],
  ];
  const t = document.getElementById("t");
  rows.forEach(([label, cells]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td class="label">' + label + '</td>' + [...cells].map(c =>
      '<td class="c">' + (c === "-" ? '<span class="n">–</span>' : '<span class="r ' + c + '">' + c + '</span>') + '</td>').join("");
    t.appendChild(tr);
  });
  // stippellijn die de A volgt
  const card = document.getElementById("card").getBoundingClientRect();
  const pts = [...document.querySelectorAll(".A")].map(e => { const r = e.getBoundingClientRect(); return [r.left - card.left + r.width/2, r.top - card.top + r.height/2]; });
  const d = pts.map((p,i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  document.getElementById("svg").innerHTML = '<path d="' + d + '" fill="none" stroke="#f28c28" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 7"/>';
</script>
</body></html>
