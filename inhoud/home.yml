# Teksten van de homepage.
#
# Zo pas je iets aan:
# - Verander alleen de tekst achter de dubbele punt of na het streepje.
# - Laat de inspringing (spaties vooraan) en de woorden vóór de dubbele punt staan.
# - In teksten mag je **vet**, *cursief* en [een link](https://voorbeeld.nl) gebruiken.
# - Begint een tekst met een aanhalingsteken, eindig hem dan ook met een aanhalingsteken.

hero:
  eyebrow: Advanced SAFe® Practice Consultant
  titel: SAFe® trainingen die aansluiten op *jouw* organisatie.
  intro: Ik geef alle officiële SAFe®-trainingen, in-house voor je teams of privé voor een kleine groep. Met voorbeelden uit jullie eigen praktijk, op een moment dat jullie uitkomt, en met de ervaring van iemand die zelf treinen heeft laten rijden.
  knop: Vraag een training aan
  knop_tweede: Bekijk het aanbod
  rollen:
    - SAFe® trainer (ASPC)
    - SAFe® consultant

usp:
  - titel: Alle trainingen
    tekst: Van AI-Empowered Leading SAFe® tot Large Solution SAFe®
  - titel: Op maat
    tekst: Casussen en oefeningen uit jullie eigen context
  - titel: Officieel
    tekst: Inclusief SAFe® Studio-toegang en examenpoging
  - titel: Uit de praktijk
    tekst: Trainer met praktijkervaring als RTE

trainingen:
  eyebrow: Aanbod
  titel: Welke training past bij jullie?
  intro: "Ik geef de nieuwste versies, waarin AI per rol een vast onderdeel is geworden: hoe zet je AI verantwoord in als versneller van je werk? Filter op rol of doelgroep. Elke training kan in het Nederlands of Engels, op locatie of online."
  noot: Duur is indicatief en kan per versie van de training verschillen. Staat je training er niet tussen? [Vraag het gerust.](#contact)

vormen:
  eyebrow: Vormen
  titel: In-house of privé, jij kiest
  blokken:
    - titel: In-house training
      tekst: Voor een team, een Agile Release Train of een groep leidinggevenden binnen één organisatie.
      punten:
        - Bij jullie op locatie, op een eigen trainingslocatie of online
        - Oefeningen met jullie eigen backlog, ART en uitdagingen
        - Ideaal vlak vóór een eerste PI Planning
        - Vaste prijs per groep, vaak voordeliger vanaf ±8 deelnemers
        - "Optioneel: begeleiding van de eerste PI Planning"
    - titel: Privé training
      tekst: Voor één persoon of een kleine groep die zich gericht wil certificeren, bijvoorbeeld een nieuwe RTE of Product Manager.
      punten:
        - Kleine groep, veel ruimte voor eigen vragen
        - Planning in overleg, ook in delen of in de avond
        - Coaching op je eigen situatie als onderdeel van de training
        - Hulp bij voorbereiding op het examen
  stappen:
    - titel: Kennismaking
      tekst: We bespreken doel, doelgroep en context (30 min.)
    - titel: Voorstel
      tekst: Training, vorm, data en een vaste prijs
    - titel: Afstemming
      tekst: Ik verwerk jullie casussen in het programma
    - titel: Training & examen
      tekst: Deelnemers krijgen toegang tot SAFe® Studio en het examen

rollen:
  eyebrow: Wat ik doe
  titel: Trainer en consultant
  intro: Trainen werkt het best als het gevoed wordt door de praktijk. Daarom combineer ik trainen met advies over hoe SAFe® in jullie organisatie écht gaat werken.
  blokken:
    - icoon: "◎"
      titel: SAFe® trainer
      tekst: Als Advanced SAFe® Practice Consultant (ASPC) ben ik bevoegd om alle SAFe®-trainingen te geven. Ik train leiders, teams en specialisten, en help organisaties een eigen trainingsritme op te zetten.
      link_tekst: Naar het aanbod →
      link: "#trainingen"
    - icoon: "⇄"
      titel: SAFe® consultant
      tekst: "Loopt jullie SAFe®-implementatie maar half, en krijgt het framework de schuld? Ik kijk mee waar het schuurt: rollen en verantwoordelijkheden die door elkaar lopen, besluiten die blijven liggen, een PI Planning die niet landt. En ik coach RTE's, Product Managers en leiders bij het invullen van hun rol, zodat het weer gaat lopen."
      link_tekst: Consultancy bespreken →
      link: "#contact"
    - icoon: "⁘"
      titel: YottaDots consultant
      tekst: YottaDots is een open, federatieve manier van organiseren die ik heb opgezet. Het centrum beslist over het *wat* met heldere, gerangschikte prioriteiten; de waardestromen bepalen het *hoe*, binnen guardrails die voor iedereen gelden. Ik help organisaties ermee aan de slag te gaan.
      link_tekst: Naar YottaDots →
      link: https://yottadots.github.io/yottadots.com/

