faq:
  eyebrow: Vragen
  titel: Veelgestelde vragen
  vragen:
    - vraag: Zijn de trainingen officieel en krijg je een certificaat?
      antwoord: Ja. Het zijn de officiële trainingen van Scaled Agile, Inc. Deelnemers krijgen het officiële cursusmateriaal, toegang tot SAFe® Studio en een examenpoging. Na het halen van het examen ontvang je de bijbehorende certificering.
    - vraag: Hoeveel deelnemers kunnen er meedoen?
      antwoord: Privé vanaf één deelnemer. In-house werk ik graag met groepen tot ongeveer 25 personen; voor grotere groepen zetten we een tweede trainer in.
    - vraag: Kan de training online?
      antwoord: Ja, alle trainingen kunnen live online worden gegeven, eventueel verdeeld over meer, kortere dagdelen.
    - vraag: Wat kost een training?
      antwoord: Dat hangt af van de training, het aantal deelnemers en de vorm. Je krijgt altijd een vaste prijs vooraf, inclusief materiaal en examen. [Vraag een voorstel aan.](#contact)
    - vraag: Kun je ook helpen na de training?
      antwoord: Zeker. Ik kan de eerste PI Planning faciliteren, jullie RTE en Product Managers coachen of meekijken waar het nog stokt. Zo landt wat er geleerd is direct in de praktijk.
    - vraag: SAFe® loopt bij ons niet lekker. Kun je helpen?
      antwoord: Vaak ligt het niet aan het framework, maar aan een implementatie die halverwege is blijven steken. Rollen lopen door elkaar, besluiten blijven liggen, en uiteindelijk krijgt SAFe® de schuld. Ik kijk mee, benoem wat er schuurt en help jullie het weer te laten lopen. Soms is een gerichte training daarbij de beste stap. [Laten we kennismaken.](#contact)

